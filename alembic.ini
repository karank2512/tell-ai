# Alembic configuration for tell. The database URL is NOT set here: alembic/env.py
# resolves it from `-x url=<sqlalchemy url>`, then `DATABASE_URL` (environment or
# .env via tell.config), so nothing secret ever lives in this file.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
version_path_separator = os
path_separator = os

[post_write_hooks]
# Keep generated revisions ruff-clean (alembic/versions is excluded from CI lint, but
# a tidy file is easier to review).
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

# --- logging (only used when alembic is run from the command line) ----------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
