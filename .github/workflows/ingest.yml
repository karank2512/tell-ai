# Four ingest runs a day (SPEC section 11; the dropped collectors per ADR 0003 are not run).
# Setup, secrets and failure policy: docs/deploy/github-actions.md.
name: ingest

on:
  schedule:
    - cron: "17 2,8,14,20 * * *" # four runs a day, off the hour
  workflow_dispatch:
    inputs:
      source:
        description: >-
          Single source to run (greenhouse, lever, ashby, smartrecruiters, edgar, news or
          discover). Empty runs everything. Resolve, score and publish always follow.
        required: false
        default: ""

# Serializes runs so two polls never race on the same board. A queued run waits; it is
# never cancelled in favour of a newer one.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  TELL_HTTP_USER_AGENT: "tell/0.1 (+https://github.com/${{ github.repository }})"
  TELL_DATA_REPO: ${{ vars.TELL_DATA_REPO }}
  # Empty variables fall back to the defaults in tell/config.py (env_ignore_empty).
  TELL_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  TELL_DATA_REPO_URL: ${{ github.server_url }}/${{ vars.TELL_DATA_REPO }}
  TELL_BASE_URL: ${{ vars.TELL_BASE_URL }}
  TELL_FEEDBACK_FORM_URL: ${{ vars.TELL_FEEDBACK_FORM_URL }}
  TELL_INTAKE_FORM_URL: ${{ vars.TELL_INTAKE_FORM_URL }}
  TELL_ENV: prod
  UV_FROZEN: "1"
  # "true" on a manual run (Actions -> Run workflow, or `gh workflow run`), "false" on the
  # schedule. Reserved for the manual-intervention marker runs.notes.manual = true, the
  # anchor of "weeks unattended" (SPEC 13.4, tell backtest ops). Nothing in tell/ reads it
  # yet (see docs/deploy/github-actions.md, "Re-running one source"); when the CLI does,
  # it must never be set on the schedule.
  TELL_RUN_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # Discovery runs ahead of the ATS legs with its own budget (<= 300 new domains per run
  # at 4 requests per second; TELL_DISCOVERY_BUDGET / TELL_DISCOVERY_RPS). A failed or
  # timed-out discovery pass never blocks polling: `ats` needs it but runs unless the run was cancelled.
  discover:
    if: ${{ !inputs.source || inputs.source == 'discover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Discover boards for new domains (budgeted)
        run: uv run tell discover batch --limit 300 --rps 4

  ats:
    needs: [discover]
    if: >-
      ${{ !cancelled() && (!inputs.source ||
      contains(fromJSON('["greenhouse","lever","ashby","smartrecruiters"]'), inputs.source)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        vendor: [greenhouse, lever, ashby, smartrecruiters]
    env:
      # A workflow_dispatch for one vendor turns the other three legs into no-ops.
      RUN_LEG: ${{ !inputs.source || inputs.source == matrix.vendor }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_LEG == 'true'
      - uses: astral-sh/setup-uv@v5
        if: env.RUN_LEG == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
        if: env.RUN_LEG == 'true'
      - name: Ingest ${{ matrix.vendor }}
        if: env.RUN_LEG == 'true'
        run: uv run tell ingest --source ${{ matrix.vendor }}
      - name: Run line to the step summary
        if: ${{ always() && env.RUN_LEG == 'true' }}
        run: |
          {
            echo '```json'
            uv run tell runlog --source ${{ matrix.vendor }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  filings:
    if: ${{ !inputs.source || inputs.source == 'edgar' || inputs.source == 'news' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Ingest edgar
        if: ${{ !inputs.source || inputs.source == 'edgar' }}
        run: uv run tell ingest --source edgar
      - name: Ingest news
        # News runs even when EDGAR failed: the two sources are independent.
        if: ${{ !cancelled() && (!inputs.source || inputs.source == 'news') }}
        run: uv run tell ingest --source news
      - name: Run lines to the step summary
        if: always()
        run: |
          {
            echo '```json'
            uv run tell runlog --source edgar || true
            uv run tell runlog --source news || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  resolve_score_publish:
    needs: [ats, filings]
    # One broken vendor never blocks the digest.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          [ -n "$TELL_DATA_REPO" ] || missing="$missing TELL_DATA_REPO(variable)"
          if [ -n "$missing" ]; then
            echo "::error::missing Actions configuration:$missing (docs/deploy/github-actions.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TELL_DATA_REPO }}
          path: tell-data
          token: ${{ secrets.TELL_DATA_PUSH_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run tell resolve
      - run: uv run tell score --all-profiles
      - run: uv run tell publish --out tell-data
      # Idempotent and cheap, so it runs every time rather than on a monthly guard: archives
      # events older than 180 days to tell-data/events and drops old posting observations.
      - run: uv run tell prune --out tell-data
      - name: Commit and push tell-data
        # The daily commit is also what keeps this schedule alive past GitHub's 60-day
        # inactivity cutoff. Retries once over a concurrent push from weekly.yml.
        working-directory: tell-data
        run: |
          git config user.name tell-bot
          git config user.email tell-bot@users.noreply.github.com
          git add -A
          git commit -m "ingest $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || { git pull --rebase origin HEAD && git push; }
      - name: Slack digest
        # The digest goes out only on the first run at or after the digest hour; decided
        # inside the command.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run tell notify --slack
      - name: Dead-man switch
        # Fails the job (red run + GitHub's free failure email) when any scheduled source
        # has had no successful run in 24 hours; writes the report to the step summary.
        if: ${{ !cancelled() }}
        run: uv run tell deadman
