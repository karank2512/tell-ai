# Ingest runs (SPEC section 11; the dropped collectors per ADR 0003 are not run): once a
# day by default, four times a day when the TELL_RUNS_PER_DAY variable is "4" (ADR 0029).
# Setup, secrets and failure policy: docs/deploy/github-actions.md. The separate discover
# job and the per-run prune step are recorded in ADR 0028.
name: ingest

on:
  schedule:
    # Two cron lines so preflight can tell the slots apart (github.event.schedule holds the
    # line that fired). The daily slot always runs: 15:17 UTC is 07:17 PST / 08:17 PDT, so
    # the Slack digest (first run at or after 07:00 local) still goes out once a day. The
    # extra slots run only when vars.TELL_RUNS_PER_DAY == '4' (ADR 0029): Actions minutes
    # are free on public repositories but metered on private ones (2,000 a month on Free).
    - cron: "17 15 * * *" # daily slot, off the hour
    - cron: "17 2,8,20 * * *" # extra slots (EXTRA_SLOTS_CRON in preflight below)
  workflow_dispatch:
    inputs:
      source:
        description: >-
          Single source to run (greenhouse, lever, ashby, smartrecruiters, edgar, news or
          discover). Empty runs everything. Resolve, score and publish always follow.
        required: false
        default: ""

# Serializes runs so two polls never race on the same board. A queued run waits; it is
# never cancelled in favour of a newer one.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  TELL_HTTP_USER_AGENT: "tell/0.1 (+https://github.com/${{ github.repository }})"
  TELL_DATA_REPO: ${{ vars.TELL_DATA_REPO }}
  # Empty variables fall back to the defaults in tell/config.py (env_ignore_empty).
  TELL_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  TELL_DATA_REPO_URL: ${{ github.server_url }}/${{ vars.TELL_DATA_REPO }}
  TELL_BASE_URL: ${{ vars.TELL_BASE_URL }}
  TELL_FEEDBACK_FORM_URL: ${{ vars.TELL_FEEDBACK_FORM_URL }}
  TELL_INTAKE_FORM_URL: ${{ vars.TELL_INTAKE_FORM_URL }}
  TELL_ENV: prod
  UV_FROZEN: "1"
  # "true" on a manual run (Actions -> Run workflow, or `gh workflow run`), "false" on the
  # schedule. The run lifecycle (tell/collectors/base.py) then writes runs.notes.manual =
  # true on every run this workflow records: the manual-intervention anchor of "weeks
  # unattended" (SPEC 13.4, tell backtest ops; ADR 0028). Never set it on a schedule.
  TELL_RUN_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # Runs first and decides whether there is anything to run. Until cutover the
  # DATABASE_URL secret does not exist and every job would fail against the local default
  # database, so the run skips cleanly and stays green instead (docs/CUTOVER_CHECKLIST.md).
  # Secrets cannot appear in a job-level if:, so this step turns their presence (never
  # their values) into true/false outputs that every other job tests. Once the secrets
  # exist the next scheduled or manual run goes live with no edit here.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      publish_enabled: ${{ steps.check.outputs.publish_enabled }}
    steps:
      - name: Check required secrets
        id: check
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_TELL_DATA_PUSH_TOKEN: ${{ secrets.TELL_DATA_PUSH_TOKEN != '' }}
          HAS_TELL_DATA_REPO: ${{ vars.TELL_DATA_REPO != '' }}
          EVENT_NAME: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
          RUNS_PER_DAY: ${{ vars.TELL_RUNS_PER_DAY }}
          EXTRA_SLOTS_CRON: "17 2,8,20 * * *"
        run: |
          enabled="$HAS_DATABASE_URL"
          extra_slot_off=false
          if [ "$EVENT_NAME" = schedule ] && [ "$FIRED_CRON" = "$EXTRA_SLOTS_CRON" ] \
            && [ "$RUNS_PER_DAY" != 4 ]; then
            enabled=false
            extra_slot_off=true
          fi
          publish_enabled=false
          if [ "$enabled" = true ] && [ "$HAS_TELL_DATA_PUSH_TOKEN" = true ] \
            && [ "$HAS_TELL_DATA_REPO" = true ]; then
            publish_enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "publish_enabled=$publish_enabled" >> "$GITHUB_OUTPUT"
          msg=""
          if [ "$extra_slot_off" = true ]; then
            msg="ingest skipped: extra slot; set the TELL_RUNS_PER_DAY variable to 4 for four runs a day (ADR 0029)"
          elif [ "$enabled" != true ]; then
            msg="ingest skipped: DATABASE_URL secret not set; see docs/CUTOVER_CHECKLIST.md"
          elif [ "$publish_enabled" != true ]; then
            msg="tell-data publish skipped: TELL_DATA_PUSH_TOKEN secret or TELL_DATA_REPO variable not set; see docs/CUTOVER_CHECKLIST.md"
          fi
          if [ -n "$msg" ]; then
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Discovery runs ahead of the ATS legs with its own budget (<= 300 new domains per run
  # at 4 requests per second; TELL_DISCOVERY_BUDGET / TELL_DISCOVERY_RPS). A failed or
  # timed-out discovery pass never blocks polling: `ats` needs it but runs unless the run was cancelled.
  discover:
    needs: [preflight]
    if: >-
      ${{ needs.preflight.outputs.enabled == 'true' &&
      (!inputs.source || inputs.source == 'discover') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Discover boards for new domains (budgeted)
        run: uv run tell discover batch --limit 300 --rps 4

  ats:
    needs: [preflight, discover]
    if: >-
      ${{ !cancelled() && needs.preflight.outputs.enabled == 'true' && (!inputs.source ||
      contains(fromJSON('["greenhouse","lever","ashby","smartrecruiters"]'), inputs.source)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        vendor: [greenhouse, lever, ashby, smartrecruiters]
    env:
      # A workflow_dispatch for one vendor turns the other three legs into no-ops.
      RUN_LEG: ${{ !inputs.source || inputs.source == matrix.vendor }}
    steps:
      - uses: actions/checkout@v7
        if: env.RUN_LEG == 'true'
      - uses: astral-sh/setup-uv@v10.2.0
        if: env.RUN_LEG == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
        if: env.RUN_LEG == 'true'
      - name: Ingest ${{ matrix.vendor }}
        if: env.RUN_LEG == 'true'
        run: uv run tell ingest --source ${{ matrix.vendor }}
      - name: Run line to the step summary
        if: ${{ always() && env.RUN_LEG == 'true' }}
        run: |
          {
            echo '```json'
            uv run tell runlog --source ${{ matrix.vendor }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  filings:
    needs: [preflight]
    if: >-
      ${{ needs.preflight.outputs.enabled == 'true' &&
      (!inputs.source || inputs.source == 'edgar' || inputs.source == 'news') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Ingest edgar
        if: ${{ !inputs.source || inputs.source == 'edgar' }}
        run: uv run tell ingest --source edgar
      - name: Ingest news
        # News runs even when EDGAR failed: the two sources are independent.
        if: ${{ !cancelled() && (!inputs.source || inputs.source == 'news') }}
        run: uv run tell ingest --source news
      - name: Run lines to the step summary
        if: always()
        run: |
          {
            echo '```json'
            uv run tell runlog --source edgar || true
            uv run tell runlog --source news || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  resolve_score_publish:
    needs: [preflight, ats, filings]
    # One broken vendor never blocks the digest; nothing runs before cutover (preflight).
    if: ${{ always() && needs.preflight.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_ENABLED: ${{ needs.preflight.outputs.publish_enabled }}
    steps:
      - name: Check configuration
        # preflight already gates this job on DATABASE_URL. Without the tell-data token or
        # variable, resolve, score and the dead-man still run and every tell-data step
        # (checkout, publish, prune, commit, digest) is skipped, so that is a warning.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::missing Actions configuration: DATABASE_URL (docs/deploy/github-actions.md)"
            exit 1
          fi
          if [ "$PUBLISH_ENABLED" != true ]; then
            echo "::warning::missing Actions configuration: TELL_DATA_PUSH_TOKEN or TELL_DATA_REPO(variable); tell-data steps skipped (docs/deploy/github-actions.md)"
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: needs.preflight.outputs.publish_enabled == 'true'
        with:
          repository: ${{ vars.TELL_DATA_REPO }}
          path: tell-data
          token: ${{ secrets.TELL_DATA_PUSH_TOKEN }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run tell resolve
      - run: uv run tell score --all-profiles
      - run: uv run tell publish --out tell-data
        if: needs.preflight.outputs.publish_enabled == 'true'
      # Idempotent and cheap, so it runs every time rather than on a monthly guard: archives
      # events older than 180 days to tell-data/events and drops old posting observations.
      # Gated with the checkout: prune deletes what it archives, so it never runs without
      # the tell-data checkout that receives the archive.
      - run: uv run tell prune --out tell-data
        if: needs.preflight.outputs.publish_enabled == 'true'
      - name: Commit and push tell-data
        if: needs.preflight.outputs.publish_enabled == 'true'
        # The daily commit is also what keeps this schedule alive past GitHub's 60-day
        # inactivity cutoff. Retries once over a concurrent push from weekly.yml.
        working-directory: tell-data
        run: |
          git config user.name tell-bot
          git config user.email tell-bot@users.noreply.github.com
          git add -A
          git commit -m "ingest $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || { git pull --rebase origin HEAD && git push; }
      - name: Slack digest
        if: needs.preflight.outputs.publish_enabled == 'true'
        # The digest goes out only on the first run at or after the digest hour; decided
        # inside the command.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run tell notify --slack
      - name: Dead-man switch
        # Fails the job (red run + GitHub's free failure email) when any scheduled source
        # has had no successful run in 24 hours; writes the report to the step summary.
        if: ${{ !cancelled() }}
        run: uv run tell deadman
