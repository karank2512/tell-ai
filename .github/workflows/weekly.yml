# Monday edition (SPEC section 11): the weekly page, refreshed methods reports, and the
# private weekly summary. Everything it writes goes to tell-data; it never commits to this
# repo (ADR 0025). Setup: docs/deploy/github-actions.md.
name: weekly

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC, off the hour
  workflow_dispatch:
    inputs:
      week:
        description: "'current' (last complete ISO week) or YYYY-Www"
        required: false
        default: current

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  TELL_HTTP_USER_AGENT: "tell/0.1 (+https://github.com/${{ github.repository }})"
  TELL_DATA_REPO: ${{ vars.TELL_DATA_REPO }}
  TELL_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  TELL_DATA_REPO_URL: ${{ github.server_url }}/${{ vars.TELL_DATA_REPO }}
  TELL_BASE_URL: ${{ vars.TELL_BASE_URL }}
  TELL_FEEDBACK_FORM_URL: ${{ vars.TELL_FEEDBACK_FORM_URL }}
  TELL_INTAKE_FORM_URL: ${{ vars.TELL_INTAKE_FORM_URL }}
  TELL_ENV: prod
  UV_FROZEN: "1"
  WEEK: ${{ inputs.week || 'current' }}

jobs:
  # Runs first and decides whether there is anything to run (same guard as ingest.yml).
  # Until cutover the DATABASE_URL secret does not exist, so the run skips cleanly and
  # stays green instead of failing against the local default database
  # (docs/CUTOVER_CHECKLIST.md). Secrets cannot appear in a job-level if:, so this step
  # turns their presence (never their values) into true/false outputs. Once the secrets
  # exist the next scheduled or manual run goes live with no edit here.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      publish_enabled: ${{ steps.check.outputs.publish_enabled }}
    steps:
      - name: Check required secrets
        id: check
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_TELL_DATA_PUSH_TOKEN: ${{ secrets.TELL_DATA_PUSH_TOKEN != '' }}
          HAS_TELL_DATA_REPO: ${{ vars.TELL_DATA_REPO != '' }}
        run: |
          enabled="$HAS_DATABASE_URL"
          publish_enabled=false
          if [ "$enabled" = true ] && [ "$HAS_TELL_DATA_PUSH_TOKEN" = true ] \
            && [ "$HAS_TELL_DATA_REPO" = true ]; then
            publish_enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "publish_enabled=$publish_enabled" >> "$GITHUB_OUTPUT"
          msg=""
          if [ "$enabled" != true ]; then
            msg="weekly skipped: DATABASE_URL secret not set; see docs/CUTOVER_CHECKLIST.md"
          elif [ "$publish_enabled" != true ]; then
            msg="tell-data publish skipped: TELL_DATA_PUSH_TOKEN secret or TELL_DATA_REPO variable not set; see docs/CUTOVER_CHECKLIST.md"
          fi
          if [ -n "$msg" ]; then
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  weekly:
    needs: [preflight]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLACK_WEEKLY_WEBHOOK_URL: ${{ secrets.SLACK_WEEKLY_WEBHOOK_URL }}
      PUBLISH_ENABLED: ${{ needs.preflight.outputs.publish_enabled }}
    steps:
      - name: Check configuration
        # preflight already gates this job on DATABASE_URL. Without the tell-data token or
        # variable only the operations line runs; every tell-data step is skipped.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::missing Actions configuration: DATABASE_URL (docs/deploy/github-actions.md)"
            exit 1
          fi
          if [ "$PUBLISH_ENABLED" != true ]; then
            echo "::warning::missing Actions configuration: TELL_DATA_PUSH_TOKEN or TELL_DATA_REPO(variable); tell-data steps skipped (docs/deploy/github-actions.md)"
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: needs.preflight.outputs.publish_enabled == 'true'
        with:
          repository: ${{ vars.TELL_DATA_REPO }}
          path: tell-data
          token: ${{ secrets.TELL_DATA_PUSH_TOKEN }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Weekly page
        if: needs.preflight.outputs.publish_enabled == 'true'
        run: uv run tell weekly --week "$WEEK" --out tell-data
      - name: Refresh methods reports into tell-data
        if: needs.preflight.outputs.publish_enabled == 'true'
        # Dated reports land in tell-data/site/methods/ (rendered on github.com, served on
        # Pages), never in this repo's docs/methods/ (ADR 0025).
        run: uv run tell backtest refresh --out tell-data/site/methods
      - name: Operations line
        run: |
          uv run tell runlog --week > "$RUNNER_TEMP/ops.json"
          {
            echo '```json'
            cat "$RUNNER_TEMP/ops.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push tell-data
        if: needs.preflight.outputs.publish_enabled == 'true'
        working-directory: tell-data
        run: |
          git config user.name tell-bot
          git config user.email tell-bot@users.noreply.github.com
          git add -A
          git commit -m "weekly $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || { git pull --rebase origin HEAD && git push; }
      - name: Weekly summary to the private Slack channel
        # Optional: skipped when SLACK_WEEKLY_WEBHOOK_URL is not set (and with tell-data).
        if: env.SLACK_WEEKLY_WEBHOOK_URL != '' && needs.preflight.outputs.publish_enabled == 'true'
        run: |
          latest=tell-data/site/api/v0/weekly/latest.json
          owner="${TELL_DATA_REPO%%/*}"
          name="${TELL_DATA_REPO#*/}"
          base="${TELL_BASE_URL:-https://${owner}.github.io/${name}}"
          jq -n \
            --slurpfile w "$latest" \
            --slurpfile ops "$RUNNER_TEMP/ops.json" \
            --arg base "$base" '
            ($w[0]) as $w | ($ops[0]) as $o |
            {text: ([
              "*tell weekly \($w.week)* (\($w.start) to \($w.end))",
              "Top sales-hiring velocity: " + ([$w.top_hiring[:5][] | "\(.name) (\(.velocity))"] | join(", ")),
              "Top new Form D: " + ([$w.top_funding[:5][] | "\(.name) (\(.amount_usd // "undisclosed"))"] | join(", ")),
              "Coverage: \($w.coverage.companies_monitored) companies, \($w.coverage.boards_polled) boards, \($w.coverage.filings_read) filings",
              "Ops: \($o.summary)",
              "Method change: \($w.method_change)",
              "\($base)/weekly/\($w.week).html"
            ] | join("\n"))}' > "$RUNNER_TEMP/weekly-slack.json"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/weekly-slack.json" "$SLACK_WEEKLY_WEBHOOK_URL"

  # GitHub disables a public repo's scheduled workflows after 60 days without activity in
  # *this* repo; the tell-data commits do not count, because they land in another repo.
  # Re-enabling through the API resets that timer without a commit, so no bot ever becomes
  # a contributor here (ADR 0026). Deliberately not gated on preflight: it needs no
  # secret, and it is what keeps the schedules enabled until cutover, so the cron goes live
  # by itself once the secrets exist.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable the scheduled workflows
        run: |
          for wf in ingest.yml weekly.yml ci.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
            echo "re-enabled ${wf}"
          done
