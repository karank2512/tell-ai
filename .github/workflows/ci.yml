name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly dependency audit (Mondays 06:13 UTC, off the hour like every schedule here);
    # only the audit and secret-scan jobs run on this trigger.
    - cron: "13 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tell
          POSTGRES_PASSWORD: tell
          POSTGRES_DB: tell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tell -d tell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tell:tell@localhost:5432/tell_test
      TELL_TEST_ADMIN_URL: postgresql+psycopg://tell:tell@localhost:5432/postgres
      TELL_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict tell

      - name: Migrate (alembic upgrade head)
        run: uv run alembic upgrade head

      # Includes tests/test_workflows.py, which parses every workflow in this directory and
      # checks each `uv run tell ...` line against the CLI.
      - name: Tests with coverage (overall floor 80)
        run: uv run pytest -q --cov=tell --cov-fail-under=80 --cov-report=json --cov-report=term-missing

      - name: Coverage floors (90 for collectors/, resolve/, signals/)
        run: uv run python scripts/check_coverage.py

  # Runs on its own so a lint or test failure never hides a leaked secret, and vice versa.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # read-only token; findings fail the job instead

  # Weekly dependency audit (SPEC section 12, "Security checks in CI").
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv sync --frozen
      - name: pip-audit
        # The workspace packages (tell, tell-mcp) are editable installs; `tell` on PyPI is an
        # unrelated project, so auditing it by name would be meaningless.
        run: uv run pip-audit --skip-editable
